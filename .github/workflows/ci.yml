name: VeriRAG CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v --cov=verirag --cov-report=term-missing

      - name: Test CLI Ingest & Evaluation Benchmark
        run: |
          python -m verirag.cli ingest sample_data/enterprise_docs/
          python -m verirag.cli query "How does Raft handle network partitions?" --top-k 2
          python -m verirag.cli benchmark --dataset sample_data/eval_gold_dataset.json
